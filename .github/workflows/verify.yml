name: Verify Driftline

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests and lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/uv.lock

      - name: Install frozen development dependencies
        run: python -m pip install uv==0.8.17 && uv sync --locked --extra dev

      - name: Ruff lint
        run: |
          uv run ruff check \
            app tests \
            ../scripts/summarize_validation.py \
            ../scripts/summarize_real_pm_pilot.py

      - name: Python test suite
        run: uv run pytest -q

      - name: Trace-to-eval quality gate
        run: uv run python -m app.trace_eval --baseline trace_eval_baseline.json

      - name: Frozen dependency audit
        run: |
          python -m pip install --disable-pip-version-check pip-audit==2.10.1
          cd ..
          ./scripts/verify_dependencies.sh

  frontend:
    name: Frontend production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Validate frontend document anchors
        working-directory: .
        run: ./scripts/verify_frontend_contract.sh

  standalone-backend-image:
    name: Standalone backend image
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Build lockfile-pinned backend image
        run: docker build --file backend/Dockerfile --tag driftline-backend:ci backend

  repository-hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Validate shell release helpers
        shell: bash
        run: |
          set -euo pipefail
          for script in scripts/*.sh; do
            bash -n "$script"
          done
          ./scripts/verify_submission_packet.sh
          git diff --check
          if git ls-files | grep -E '(^|/)\.env(\.|$)' | grep -vE '(^|/)\.env\.example$'; then
            echo 'Tracked environment files other than .env.example are forbidden.' >&2
            exit 1
          fi
          if git ls-files | grep -E '(^|/)(credentials|service-account)[^/]*\.(json|pem|p12|pfx|key)$'; then
            echo 'Tracked credential material is forbidden.' >&2
            exit 1
          fi
          if rg -n 'identity_token\s*:\s*operatorSession\.identityToken' frontend/src/api.js; then
            echo 'Google ID tokens must stay in Authorization headers, not JSON bodies.' >&2
            exit 1
          fi
