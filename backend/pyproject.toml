[project]
name = "driftline-agent"
version = "0.1.0"
description = "Evidence-bound product Decision Twin with human-authorized reversible action"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116.0",
  "google-adk>=2.0.0",
  "google-cloud-bigquery>=3.38.0",
  "google-cloud-firestore>=2.21.0",
  "google-cloud-secret-manager>=2.20.0",
  "google-cloud-storage>=2.18.0",
  "google-cloud-tasks>=2.19.0",
  "python-dotenv>=1.0.0",
  "uvicorn[standard]>=0.35.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.24.0", "ruff>=0.12.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 88
