      .line{stroke:#3975c6;stroke-width:4;fill:none;marker-end:url(#arrow)}.loop{stroke:#17834f;stroke-width:4;fill:none;marker-end:url(#arrow)}
      .pill{fill:#eef5ff;stroke:#bdd0ed}.pillt{font-size:13px;font-weight:700;fill:#244d88}.proof{font-size:15px;font-weight:700;fill:#dceaff}.proof2{font-size:14px;font-weight:400;fill:#bcd0ee}
    </style>
