  <rect x="915" y="514" width="230" height="30" rx="15" class="pill"/><text x="937" y="534" class="pillt">Generation 2 · rollback</text><text x="1168" y="534" class="tiny">7/7 policy checks</text>
  <rect x="55" y="625" width="1490" height="182" rx="22" fill="#10213d"/>
  <text x="90" y="672" class="coreh">Google Cloud production proof</text>
  <text x="90" y="708" class="proof">Vertex AI + Google ADK</text><text x="90" y="735" class="proof2">Gemini council and bounded inspect tools</text>
  <text x="410" y="708" class="proof">Firebase → Cloud Run + Firestore</text><text x="410" y="735" class="proof2">Public facade, API, cases, lineage, audit</text>
  <text x="730" y="708" class="proof">BigQuery + vector memory</text><text x="730" y="735" class="proof2">Aggregate evidence and precedent retrieval</text>
  <text x="1080" y="708" class="proof">Tasks + Scheduler</text><text x="1080" y="735" class="proof2">Durable outcomes, retries, cadence</text>
  <text x="90" y="779" class="proof2">Cloud Build + Artifact Registry · revision driftline-00305-xln · app SHA 03ec8f12fc23 · 100% traffic · 0 recent errors</text>
  <text x="70" y="855" class="tiny">Authority boundary: Gemini recommends from bounded evidence. Deterministic policy and a named human authorize action.</text>
