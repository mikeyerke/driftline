<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#eef4ff"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b66e4"/><stop offset="1" stop-color="#173f9f"/></linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#17834f"/><stop offset="1" stop-color="#0e633b"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#17335c" flood-opacity=".11"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#3975c6"/></marker>
    <style>
      .title,.sub,.lane,.h,.b,.tiny,.coreh,.coreb,.pillt,.proof,.proof2{font-family:Helvetica,Arial,sans-serif}
      .title{font-size:42px;font-weight:700;fill:#10213d}.sub{font-size:20px;font-weight:400;fill:#55657d}.lane{font-size:14px;font-weight:700;letter-spacing:1.6px;fill:#496483}
      .h{font-size:20px;font-weight:700;fill:#122442}.b{font-size:15px;font-weight:400;fill:#53647b}.tiny{font-size:13px;font-weight:600;fill:#65758a}
