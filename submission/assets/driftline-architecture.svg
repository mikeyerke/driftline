<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#edf4ff"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b66e4"/><stop offset="1" stop-color="#1649b7"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#17335c" flood-opacity=".12"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#3975c6"/></marker>
    <style>.title{font:700 42px Arial;fill:#10213d}.sub{font:400 20px Arial;fill:#55657d}.lane{font:700 16px Arial;letter-spacing:1.7px;fill:#46607f}.h{font:700 21px Arial;fill:#122442}.b{font:400 16px Arial;fill:#53647b}.tiny{font:600 14px Arial;fill:#65758a}.box{fill:#fff;stroke:#cfdbec;stroke-width:2;filter:url(#shadow)}.core{fill:url(#blue);stroke:#0b55c4;stroke-width:2;filter:url(#shadow)}.coreh{font:700 22px Arial;fill:#fff}.coreb{font:400 16px Arial;fill:#dceaff}.line{stroke:#3975c6;stroke-width:4;fill:none;marker-end:url(#arrow)}.dash{stroke:#7594be;stroke-width:3;stroke-dasharray:8 8;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="80" y="78" class="title">Driftline · Evidence-bound Taskmaster architecture</text><text x="80" y="112" class="sub">One monitored promise change becomes durable, policy-gated, reversible owner action.</text>
  <text x="80" y="168" class="lane">OBSERVE</text><text x="390" y="168" class="lane">ORCHESTRATE</text><text x="720" y="168" class="lane">CONTROL</text><text x="1050" y="168" class="lane">ACT</text><text x="1360" y="168" class="lane">PROVE</text>
  <rect x="60" y="205" width="250" height="170" rx="18" class="box"/><text x="90" y="248" class="h">Approved sources</text><text x="90" y="282" class="b">Pinned public fixtures</text><text x="90" y="309" class="b">Exact tenant URLs</text><text x="90" y="336" class="b">Cadence + freshness SLA</text>
  <rect x="375" y="205" width="280" height="170" rx="18" class="core"/><text x="405" y="248" class="coreh">Cloud Tasks + ADK</text><text x="405" y="282" class="coreb">Asynchronous job claim</text><text x="405" y="309" class="coreb">Gemini 3.5 Flash</text><text x="405" y="336" class="coreb">2 allowlisted read tools</text>
  <rect x="710" y="205" width="280" height="170" rx="18" class="box"/><text x="740" y="248" class="h">Deterministic policy</text><text x="740" y="282" class="b">Schema + evidence hash</text><text x="740" y="309" class="b">Risk + artifact allowlist</text><text x="740" y="336" class="b">Named human approval</text>
  <rect x="1045" y="205" width="250" height="170" rx="18" class="box"/><text x="1075" y="248" class="h">Action adapters</text><text x="1075" y="282" class="b">Packet-safe public lane</text><text x="1075" y="309" class="b">Signed Jira action</text><text x="1075" y="336" class="b">Idempotent reversal</text>
  <rect x="1350" y="205" width="190" height="170" rx="18" class="box"/><text x="1380" y="248" class="h">Judge proof</text><text x="1380" y="282" class="b">React console</text><text x="1380" y="309" class="b">Trace gate</text><text x="1380" y="336" class="b">Release SHA</text>
  <path d="M310 290 H365" class="line"/><path d="M655 290 H700" class="line"/><path d="M990 290 H1035" class="line"/><path d="M1295 290 H1340" class="line"/>
  <rect x="375" y="445" width="280" height="148" rx="18" class="box"/><text x="405" y="486" class="h">Structured intelligence</text><text x="405" y="520" class="b">Evidence interpretation</text><text x="405" y="547" class="b">Impact map + options</text><text x="405" y="574" class="b">Citations + rollback</text>
  <rect x="710" y="445" width="280" height="148" rx="18" class="box"/><text x="740" y="486" class="h">Firestore control plane</text><text x="740" y="520" class="b">Jobs · workflows · traces</text><text x="740" y="547" class="b">Observations · actions</text><text x="740" y="574" class="b">Append-only audit</text>
  <rect x="1045" y="445" width="250" height="148" rx="18" class="box"/><text x="1075" y="486" class="h">Tenant security</text><text x="1075" y="520" class="b">Google OIDC identity</text><text x="1075" y="547" class="b">Secret Manager binding</text><text x="1075" y="574" class="b">Operation-level scope</text>
  <path d="M515 375 V435" class="line"/><path d="M850 375 V435" class="line"/><path d="M1170 375 V435" class="line"/><path d="M655 520 H700" class="dash"/><path d="M990 520 H1035" class="dash"/>
  <rect x="60" y="675" width="1480" height="135" rx="22" fill="#10213d"/><text x="100" y="720" class="coreh">Authority boundary</text><text x="100" y="757" class="coreb">Gemini can interpret evidence and recommend work. It cannot approve itself, read tenant credentials, widen connector scope, or bypass the evidence hash.</text><text x="100" y="789" class="coreb">Cloud Run hosts the API + console · Cloud Scheduler drives monitoring · Cloud Storage retains versioned packets and reversal markers.</text>
  <text x="1240" y="857" class="tiny">Taskmaster · Google All Things Agentic Hackathon</text>
</svg>
