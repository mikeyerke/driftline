<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Driftline final demo slide</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #07152f; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .stage { position: relative; width: 100vw; height: 100vh; background: #07152f; }
    .frame { width: 100%; height: 100%; object-fit: cover; display: block; }
    .badge { position: absolute; top: 24px; right: 28px; padding: 10px 15px; border: 1px solid rgba(255,255,255,.35); border-radius: 999px; color: white; background: rgba(7,21,47,.9); font-size: 17px; font-weight: 750; letter-spacing: .02em; box-shadow: 0 4px 18px rgba(7,21,47,.24); }
    .caption { position: absolute; left: 44px; right: 44px; bottom: 34px; display: grid; gap: 8px; padding: 19px 25px 20px; border: 1px solid rgba(255,255,255,.23); border-radius: 16px; color: white; background: rgba(7,21,47,.93); box-shadow: 0 12px 34px rgba(7,21,47,.34); }
    .caption strong { font-size: 27px; line-height: 1.16; letter-spacing: -.015em; }
    .caption span { color: #d8e7ff; font-size: 20px; line-height: 1.3; }
    .live { color: #75e2a9 !important; font-weight: 750; }
  </style>
</head>
<body>
  <main class="stage">
    <img class="frame" id="frame" alt="Driftline live product proof">
    <div class="badge">LIVE VERIFIED · public main 03ec8f1</div>
    <div class="caption"><strong id="title"></strong><span id="detail"></span></div>
  </main>
  <script>
    const slides = [
      ["decision-twin-hero-final.png", "A product decision becomes dangerous when evidence changes but the commitment does not.", "LIVE: https://driftline-ops.web.app/ · No sign-in required"],
      ["decision-twin-generation-1-final.png", "Generation 1: the council rejects a universal rollout.", "Five cited signals · five independent agents · BigQuery-vector precedent"],
      ["decision-twin-council-final.png", "Google ADK specialists preserve evidence and dissent.", "Customer · usage · strategy · feasibility · challenger · no mutation tools"],
      ["decision-twin-options-final.png", "Four counterfactuals make the tradeoffs inspectable before approval.", "Ship · rollback · segment · defer · each with success, stop, and rollback terms"],
      ["decision-twin-approval-ready-final.png", "Gemini recommends; a named human authorizes.", "Approval binds the selected response to the exact evidence and synthesis hashes"],
      ["decision-twin-monitor-final.png", "One approval starts the autonomous outcome monitor.", "Cloud Tasks evaluates the committed threshold · no second PM prompt"],
      ["decision-twin-generation-2-final.png", "Generation 2 reopens automatically with rollback selected.", "The measured guardrail invalidated the segmented experiment · fresh approval required"],
      ["decision-twin-generation-2-receipt-final.png", "The learning receipt preserves why the decision changed.", "7/7 policy checks · original approval and outcome · complete generation lineage"],
      ["driftline-decision-twin-architecture.png", "A bounded Google Cloud agent—not a chat wrapper.", "Vertex AI + ADK · Cloud Run · Firestore · BigQuery vector memory · Tasks + Scheduler"]
    ];
    const index = Math.max(0, Math.min(slides.length - 1, Number(new URLSearchParams(location.search).get("slide") || 0)));
    const [image, title, detail] = slides[index];
    document.getElementById("frame").src = image;
    document.getElementById("title").textContent = title;
    const detailNode = document.getElementById("detail");
    detailNode.textContent = detail;
    if (index === 0) detailNode.classList.add("live");
  </script>
</body>
</html>
