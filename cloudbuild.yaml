steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --tag
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/driftline:$BUILD_ID
      - .
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/driftline:$BUILD_ID
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - driftline
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/driftline:$BUILD_ID
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --service-account=${_RUN_SERVICE_ACCOUNT}
      - --min=0
      # Keep both the service and this revision bounded to one instance. The
      # revision-level flag prevents an older service template from widening
      # the cap on a future deploy.
      - --max=1
      - --max-instances=1
      - --cpu=1
      - --memory=512Mi
      - --timeout=300
      - --concurrency=20
      - --labels=app=driftline,environment=production,hackathon=all-things-agentic
      - --set-env-vars=GOOGLE_CLOUD_PROJECT=$PROJECT_ID,GOOGLE_CLOUD_LOCATION=global,GOOGLE_GENAI_USE_VERTEXAI=true,MODEL_NAME=gemini-3.5-flash,DRIFTLINE_PERSISTENCE=firestore,FIRESTORE_DATABASE=(default),DRIFTLINE_SOURCE_MODE=public,DRIFTLINE_PUBLIC_SOURCE_URL=https://raw.githubusercontent.com/mikeyerke/driftline/a48f7eb/fixtures/public-pricing-after.txt,DRIFTLINE_TERMS_SOURCE_URL=https://raw.githubusercontent.com/mikeyerke/driftline/a48f7eb/fixtures/public-terms-after.txt,DRIFTLINE_ARTIFACT_BUCKET=driftline-artifacts-724959673622,DRIFTLINE_TASKS_ENABLED=true,DRIFTLINE_TASK_QUEUE=driftline-jobs,DRIFTLINE_TASK_LOCATION=us-central1,DRIFTLINE_TASK_TARGET_URL=https://driftline-xvxczqg62a-uc.a.run.app,DRIFTLINE_TASK_SERVICE_ACCOUNT=driftline-runtime@driftline-hackathon-2026.iam.gserviceaccount.com,DRIFTLINE_SCHEDULER_AUDIENCE=https://driftline-xvxczqg62-uc.a.run.app,DRIFTLINE_SCHEDULER_SERVICE_ACCOUNT=driftline-scheduler@driftline-hackathon-2026.iam.gserviceaccount.com,DRIFTLINE_APPROVAL_MODE=demo,DRIFTLINE_AGENT_MAX_CALLS=10,DRIFTLINE_AGENT_WINDOW_SECONDS=3600,DRIFTLINE_DEMO_MAX_MUTATIONS=30,DRIFTLINE_DEMO_WINDOW_SECONDS=3600,DRIFTLINE_JIRA_ENABLED=true,DRIFTLINE_JIRA_BASE_URL=https://api.atlassian.com/ex/jira/7ed26020-ee58-470a-8fbb-3340925348ce,DRIFTLINE_JIRA_EMAIL=mikeyerke@gmail.com,DRIFTLINE_JIRA_PROJECT_KEY=KAN,DRIFTLINE_JIRA_ISSUE_TYPE=Task,DRIFTLINE_CONFLUENCE_ENABLED=false,DRIFTLINE_SLACK_ENABLED=false,DRIFTLINE_GITHUB_ENABLED=false
      - --update-secrets=DRIFTLINE_JIRA_TOKEN=driftline-jira-token:latest
substitutions:
  _REGION: us-central1
  _REPOSITORY: driftline
  _RUN_SERVICE_ACCOUNT: driftline-runtime@driftline-hackathon-2026.iam.gserviceaccount.com
images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/driftline:$BUILD_ID
