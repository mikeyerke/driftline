steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --tag
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/driftline:$BUILD_ID
      - .
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/driftline:$BUILD_ID
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - driftline
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/driftline:$BUILD_ID
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --service-account=${_RUN_SERVICE_ACCOUNT}
      - --min=0
      - --max=1
      - --max-instances=1
      - --cpu=1
      - --memory=512Mi
      - --timeout=300
      - --concurrency=20
      - --labels=app=driftline,environment=production,hackathon=all-things-agentic
      - --set-env-vars=GOOGLE_CLOUD_PROJECT=$PROJECT_ID,GOOGLE_CLOUD_LOCATION=global,GOOGLE_GENAI_USE_VERTEXAI=true,MODEL_NAME=gemini-3.5-flash,DRIFTLINE_PERSISTENCE=firestore,FIRESTORE_DATABASE=(default),DRIFTLINE_SOURCE_MODE=public,DRIFTLINE_PUBLIC_SOURCE_URL=https://raw.githubusercontent.com/mikeyerke/driftline/a48f7eb/fixtures/public-pricing-after.txt,DRIFTLINE_TERMS_SOURCE_URL=https://raw.githubusercontent.com/mikeyerke/driftline/a48f7eb/fixtures/public-terms-after.txt,DRIFTLINE_MONITOR_SOURCES=all,DRIFTLINE_MONITOR_MAX_SOURCES=25,DRIFTLINE_ARTIFACT_BUCKET=driftline-artifacts-724959673622,DRIFTLINE_TASKS_ENABLED=true,DRIFTLINE_TASK_QUEUE=driftline-jobs,DRIFTLINE_TASK_LOCATION=us-central1,DRIFTLINE_TASK_TARGET_URL=https://driftline-xvxczqg62a-uc.a.run.app,DRIFTLINE_TASK_SERVICE_ACCOUNT=driftline-runtime@driftline-hackathon-2026.iam.gserviceaccount.com,DRIFTLINE_SCHEDULER_AUDIENCE=https://driftline-xvxczqg62a-uc.a.run.app,DRIFTLINE_SCHEDULER_SERVICE_ACCOUNT=driftline-scheduler@driftline-hackathon-2026.iam.gserviceaccount.com,DRIFTLINE_APPROVAL_MODE=demo,DRIFTLINE_SIGNED_APPROVALS_ENABLED=true,DRIFTLINE_GOOGLE_OPERATOR_AUDIENCE=32555940559.apps.googleusercontent.com,DRIFTLINE_PLATFORM_OPERATOR_EMAILS=mikeyerke@gmail.com,DRIFTLINE_DEFAULT_TENANT_ID=driftline-demo,DRIFTLINE_DEFAULT_TENANT_ROLE=owner,DRIFTLINE_ALLOW_DURABLE_HMAC_TENANTS=true,DRIFTLINE_TENANT_SIGNING_SECRET_PREFIX=driftline-tenant-operator-,DRIFTLINE_REQUIRE_TENANT_SIGNING_SECRETS=true,DRIFTLINE_TENANT_SECRET_IDENTITY_MODE=impersonated,DRIFTLINE_REQUIRE_TENANT_CREDENTIAL_NAMESPACE=true,DRIFTLINE_WRITE_LEGACY_CONNECTOR_MIRROR=false,DRIFTLINE_RETENTION_DAYS=30,DRIFTLINE_MAX_JOB_ATTEMPTS=3,DRIFTLINE_AGENT_MAX_CALLS=10,DRIFTLINE_AGENT_WINDOW_SECONDS=3600,DRIFTLINE_DEMO_MAX_MUTATIONS=30,DRIFTLINE_DEMO_WINDOW_SECONDS=3600,DRIFTLINE_MULTIMODAL_MAX_CALLS=10,DRIFTLINE_MULTIMODAL_WINDOW_SECONDS=3600,DRIFTLINE_ALLOW_LEGACY_GLOBAL_CONNECTOR_SECRETS=false,DRIFTLINE_ALLOW_DEPLOYMENT_CONNECTOR_TARGET_FALLBACK=false,DRIFTLINE_SALESFORCE_ENABLED=true,DRIFTLINE_SALESFORCE_CLIENT_ID_SECRET=driftline-sf-client-id,DRIFTLINE_SALESFORCE_CLIENT_SECRET_SECRET=driftline-sf-client-secret,DRIFTLINE_SALESFORCE_REDIRECT_URI=https://driftline-xvxczqg62a-uc.a.run.app/api/connectors/salesforce/oauth/callback,DRIFTLINE_JIRA_ENABLED=true,DRIFTLINE_CONFLUENCE_ENABLED=true,DRIFTLINE_SLACK_ENABLED=true,DRIFTLINE_GITHUB_ENABLED=true
      - --remove-secrets=DRIFTLINE_JIRA_TOKEN,DRIFTLINE_CONFLUENCE_TOKEN,DRIFTLINE_SLACK_TOKEN,DRIFTLINE_GITHUB_TOKEN,DRIFTLINE_APPROVAL_SIGNING_SECRET
substitutions:
  _REGION: us-central1
  _REPOSITORY: driftline
  _RUN_SERVICE_ACCOUNT: driftline-runtime@driftline-hackathon-2026.iam.gserviceaccount.com
options:
  logging: CLOUD_LOGGING_ONLY
images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/driftline:$BUILD_ID
