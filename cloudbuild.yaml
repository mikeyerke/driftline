steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --tag
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/driftline:$BUILD_ID
      - .
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/driftline:$BUILD_ID
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - driftline
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/driftline:$BUILD_ID
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --service-account=${_RUN_SERVICE_ACCOUNT}
      - --min=0
      - --max=1
      - --cpu=1
      - --memory=512Mi
      - --timeout=300
      - --concurrency=20
      - --labels=app=driftline,environment=production,hackathon=all-things-agentic
      - --set-env-vars=GOOGLE_CLOUD_PROJECT=$PROJECT_ID,GOOGLE_CLOUD_LOCATION=global,GOOGLE_GENAI_USE_VERTEXAI=true,MODEL_NAME=gemini-3.5-flash,DRIFTLINE_PERSISTENCE=firestore,FIRESTORE_DATABASE=(default),DRIFTLINE_SOURCE_MODE=public,DRIFTLINE_PUBLIC_SOURCE_URL=https://raw.githubusercontent.com/mikeyerke/driftline/63d12451e80417a76e2b8965bb6646ca849a704e/fixtures/public-pricing-after.txt,DRIFTLINE_TASKS_ENABLED=true,DRIFTLINE_TASK_QUEUE=driftline-jobs,DRIFTLINE_TASK_LOCATION=us-central1,DRIFTLINE_TASK_TARGET_URL=https://driftline-xvxczqg62a-uc.a.run.app,DRIFTLINE_TASK_SERVICE_ACCOUNT=driftline-runtime@driftline-hackathon-2026.iam.gserviceaccount.com,DRIFTLINE_AGENT_MAX_CALLS=10,DRIFTLINE_AGENT_WINDOW_SECONDS=3600,DRIFTLINE_DEMO_MAX_MUTATIONS=30,DRIFTLINE_DEMO_WINDOW_SECONDS=3600
substitutions:
  _REGION: us-central1
  _REPOSITORY: driftline
  _RUN_SERVICE_ACCOUNT: driftline-runtime@driftline-hackathon-2026.iam.gserviceaccount.com
images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/driftline:$BUILD_ID
